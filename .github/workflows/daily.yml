name: 一体包候选评分
on:
  schedule:
    # GitHub native schedule; UTC -> Asia/Shanghai 17:00 / 18:00
    - cron: '0 9 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '历史复算日期 YYYY-MM-DD，留空按当天交易日历'
        required: false
        type: string
  push:
    branches: [main]
    paths: ['rank.py', 'aggregate_watch.py', '.github/workflows/daily.yml']
permissions:
  contents: write
concurrency:
  group: yitibao-daily
  cancel-in-progress: false
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'baostock>=0.8.9,<1' 'exchange-calendars>=4.11,<5'
      - name: Follow upstream updates and rebuild dated aggregate
        env:
          REPORT_DATE: ${{ inputs.date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [ -n "$REPORT_DATE" ]; then args+=(--date "$REPORT_DATE"); fi
          wait_seconds=0
          if [ "$EVENT_NAME" = schedule ]; then wait_seconds=1200; fi
          python -u aggregate_watch.py --wait-seconds "$wait_seconds" "${args[@]}"
      - name: Publish report
        if: always()
        run: |
          git add reports/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish combined ranking'
          git pull --rebase origin main
          git push origin HEAD:main
